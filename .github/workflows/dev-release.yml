name: Dev release (Android)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "screenshots/**"
  workflow_dispatch:

concurrency:
  group: dev-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - run: npm ci

      - run: npm run typecheck

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        id: apk
        run: |
          short=$(git rev-parse --short HEAD)
          name="kryfsec-dev-${short}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Publish rolling "dev" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev "${{ steps.apk.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Dev build (${{ steps.apk.outputs.short }})" \
            --notes "Automated Android dev build from \`${GITHUB_SHA}\`. Signed with the debug key; not for production."
